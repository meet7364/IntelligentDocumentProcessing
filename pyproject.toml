[project]
name = "idp-financial-documents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "meet7364", email = "mmmmodi21@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "easyocr>=1.7.2",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "streamlit==1.61.1",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
